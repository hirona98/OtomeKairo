[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otomekairo-microphone-connector"
version = "0.1.0"
description = "ALSA microphone input connector for OtomeKairo"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache License 2.0" }
authors = [
  { name = "hiro9" }
]
dependencies = [
  "numpy>=2.0.0",
  "sounddevice>=0.5.0",
  "soxr>=1.0.0",
  "websockets>=15.0"
]

[project.scripts]
otomekairo-microphone-connector = "otomekairo_microphone_connector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
