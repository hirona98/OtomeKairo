[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otomekairo-pico-environment-connector"
version = "0.1.0"
description = "USB Pico environment sensor producer for OtomeKairo"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache License 2.0" }
dependencies = ["pyserial>=3.5,<4"]

[project.scripts]
otomekairo-pico-environment-connector = "otomekairo_pico_environment_connector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
