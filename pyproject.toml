[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otomekairo"
version = "0.1.0"
description = "OtomeKairo server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache License 2.0" }
authors = [
  { name = "hiro9" }
]
dependencies = [
  "kaldi-native-fbank>=1.22.3",
  "litellm>=1.0.0",
  "numpy>=2.0.0",
  "onnxruntime>=1.20.0",
  "pytest>=8.0.0",
  "sqlite-vec>=0.1.6"
]

[project.scripts]
otomekairo-run = "otomekairo.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"otomekairo" = ["default_console_motion.json"]
"otomekairo.audio.model_assets" = ["*.json", "*.md", "*.onnx"]
"otomekairo.web.static" = ["*.html", "*.js", "*.css", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
